name: Build xdBot Android64

'on':
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: geode-sdk/build-geode-mod@main
    with:
      target: Android64
      build-config: Release
      combine: true

  - uses: actions/upload-artifact@v4
    if: always()
    with:
      name: build-output
      path: build/
      if-no-files-found: warn
