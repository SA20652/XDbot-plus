name: Build xdBot+ Android64

'on':
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build Geode mod
    uses: geode-sdk/build-geode-mod@main
    with:
      target: Android64
      sdk: given
      build-config: Release
      combine: false
      bindings: SA20652/bindings
      bindings-ref: main
      configure-args: "-DCMAKE_UNITY_BUILD=OFF -DGEODE_DISABLE_PRECOMPILED_HEADERS=ON"

  - name: Upload build output
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: xdBot-plus-Android64-build
      path: |
        output/
        build/
      if-no-files-found: warn
